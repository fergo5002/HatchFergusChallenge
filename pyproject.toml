[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-fergus-challenge"
version = "0.1.0"
description = "Deterministic 10-week revenue survivability ranker for Hatch105 startup theses."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fergus O'Reilly" }]
dependencies = []

[project.scripts]
hatch-rank = "hatch_ranker.cli:main"
hatch-stress = "hatch_ranker.stress:main"
hatch-ui = "hatch_ranker.web:main"

[tool.setuptools.packages.find]
include = ["hatch_ranker*"]

[tool.setuptools.package-data]
"hatch_ranker.web_static" = ["*.html", "*.css", "*.js"]
